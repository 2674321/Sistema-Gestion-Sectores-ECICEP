# ECICEP — GitHub Pages: publica la demo estática del formulario de captura.
# Solo sirve examples/formulario_demo.html (datos ficticios, sin backend).
# URL: https://2674321.github.io/Sistema-Gestion-Sectores-ECICEP/
name: pages-demo

on:
  push:
    branches: [master]
    paths: ['examples/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preparar sitio (demo como index.html)
        run: |
          mkdir -p _site
          cp examples/formulario_demo.html _site/index.html

      - name: Subir artefacto Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5