# ECICEP — CI: baterías de pruebas deterministas (pure Node, sin red ni Sheets).
# Se ejecuta en cada push a master y en cualquier PR.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20

      - name: Sin datos personales en el repositorio
        run: |
          set -e
          banned=$(find . -not -path './.git/*' -not -path './datos_prueba/*' \
            -not -path './node_modules/*' \
            \( -name '*.xlsx' -o -name '*.xls' -o -name '*.csv' \) | sort)
          if [ -n "$banned" ]; then
            echo "ERROR: Se detectaron archivos de datos potencialmente reales versionados:"
            echo "$banned"
            exit 1
          fi
          echo "OK: sin archivos de datos fuera de datos_prueba/"

      - name: Sintaxis y todas las baterías (descubrimiento automático)
        run: |
          git diff --check
          node tools/verificar.mjs
