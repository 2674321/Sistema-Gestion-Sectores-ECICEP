# ECICEP — CI: baterías de pruebas deterministas (pure Node, sin red ni Sheets).
# Se ejecuta en cada push a master y en cualquier PR.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Sintaxis src/*.js y *.gs
        run: |
          set -e
          for f in src/*.js; do node --check "$f"; done
          # node --check no conoce .gs: se valida como .js temporal.
          for f in src/*.gs; do
            tmp="$(mktemp --suffix=.js)"
            cp "$f" "$tmp"
            node --check "$tmp"
            rm -f "$tmp"
          done

      - name: Sin datos personales en el repositorio
        run: |
          set -e
          banned=$(find . -not -path './.git/*' -not -path './datos_prueba/*' \
            -not -path './node_modules/*' \
            \( -name '*.xlsx' -o -name '*.xls' -o -name '*.csv' \) | sort)
          if [ -n "$banned" ]; then
            echo "ERROR: Se detectaron archivos de datos potencialmente reales versionados:"
            echo "$banned"
            exit 1
          fi
          echo "OK: sin archivos de datos fuera de datos_prueba/"

      - name: Batería núcleo
        run: node tests/ejecutar_local.mjs

      - name: Sintaxis <script> embebidos en HTML (Web App, guía, paneles, demo)
        run: node tests/validar_html.mjs

      - name: Batería aceptación formulario
        run: node tests/aceptacion_formulario.mjs

      - name: Batería captura backend V2
        run: node tests/captura_backend_v2.mjs

      - name: Batería captura UI/payload V2
        run: node tests/captura_ui_payload_v2.mjs

      - name: Batería cola FORM_RESPUESTAS
        run: node tests/cola_form_respuestas.mjs

      - name: Batería contrato captura V2
        run: node tests/contrato_captura_v2.mjs

      - name: Batería contrato datos
        run: node tests/contrato_datos.mjs

      - name: Batería formulario web
        run: node tests/formulario_web.mjs