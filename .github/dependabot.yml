# ECICEP — Dependabot
# Mantiene al día las GitHub Actions usadas por los workflows (linux, Node).
# Sin manifiesto npm: las baterías son scripts .mjs puros de Node.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Santiago"
    labels:
      - dependencias
      - automático
    open-pull-requests-limit: 5