<!DOCTYPE html>
<html>
<head>
<base target="_top">
<?!= include('00_Tokens') ?>
<style>
/* Vista dialog ancho: 16px */
body{font-size:16px;padding:var(--space-5)}
header{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4);flex-wrap:wrap}
header h1{font-size:22px;margin:0;color:var(--text-primary)}
header .sub{color:var(--text-muted);font-size:13px;width:100%;margin-top:2px}
.filtros{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap;margin-bottom:var(--space-4);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4)}
.chip-filtro{cursor:pointer;border:1px solid var(--border-strong);background:var(--surface)}
.chip-filtro.on{color:#fff;border-color:transparent}
.chip-filtro.on.naranjo{background:var(--sector-naranjo)}
.chip-filtro.on.amarillo{background:var(--sector-amarillo)}
.chip-filtro.on.verde{background:var(--sector-verde)}
.rango{display:flex;gap:8px;align-items:center;margin-left:auto;color:var(--text-secondary);font-size:13px}
.grid-kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--space-3);margin-bottom:var(--space-4)}
.kpi .etq{margin-bottom:6px}
.kpi .num{font-size:34px;font-weight:700;color:var(--text-primary);line-height:1.1}
.kpi .delta{font-size:12px;font-weight:600;margin-top:4px}
.delta.up{color:var(--success)}.delta.down{color:var(--danger)}.delta.neu{color:var(--text-muted)}
.grid-charts{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.chart-card h3{margin:0 0 var(--space-3);font-size:15px}
.chart-wrap{position:relative;height:260px}
@media(max-width:900px){.grid-kpi{grid-template-columns:repeat(2,1fr)}.grid-charts{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Estadísticas</h1><span class="chip rut" id="chipGen">…</span>
  <div class="sub">Los KPIs y gráficos reaccionan a los filtros · El rango de fechas define la ventana del gráfico de ingresos por mes</div>
</header>

<div class="filtros">
  <span class="etq" style="margin:0">Sectores:</span>
  <span class="chip chip-filtro on naranjo" data-s="NARANJO">Naranjo</span>
  <span class="chip chip-filtro on amarillo" data-s="AMARILLO">Amarillo</span>
  <span class="chip chip-filtro on verde" data-s="VERDE">Verde</span>
  <div class="rango">
    <i data-lucide="calendar-range" style="width:16px;height:16px"></i>
    <input type="date" id="fDesde" class="inp" style="width:150px;min-height:36px">
    <span>→</span>
    <input type="date" id="fHasta" class="inp" style="width:150px;min-height:36px">
  </div>
</div>

<section class="grid-kpi">
  <div class="card kpi"><label class="etq">Total pacientes</label><div class="num" id="kTotal">—</div><div class="delta neu" id="kTotalD"></div></div>
  <div class="card kpi"><label class="etq">% estratificación pendiente</label><div class="num" id="kPend">—</div><div class="delta neu"></div></div>
  <div class="card kpi"><label class="etq">Ingresos del mes</label><div class="num" id="kIng">—</div><div class="delta neu" id="kIngD"></div></div>
  <div class="card kpi"><label class="etq">Con revisión pendiente</label><div class="num" id="kRev">—</div><div class="delta neu"></div></div>
  <div class="card kpi"><label class="etq">Patología más frecuente</label><div style="font:600 15px 'Inter';margin-top:8px" id="kPat">—</div><div class="delta neu num" id="kPatC"></div></div>
</section>

<section class="grid-charts">
  <div class="card chart-card"><h3>Pacientes por sector</h3><div class="chart-wrap"><canvas id="chSector"></canvas></div></div>
  <div class="card chart-card"><h3>Estratificación <span class="etq" style="display:inline">(escala propia, no semáforo)</span></h3><div class="chart-wrap"><canvas id="chEst"></canvas></div></div>
  <div class="card chart-card"><h3>Ingresos por mes</h3><div class="chart-wrap"><canvas id="chIng"></canvas></div></div>
  <div class="card chart-card"><h3>Patologías más frecuentes</h3><div class="chart-wrap"><canvas id="chPat"></canvas></div></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@0.294.0/dist/umd/lucide.min.js"></script>
<script>
var D=null, CH={}, SECTORES=['NARANJO','AMARILLO','VERDE'];
var COL_SEC={NARANJO:'#E8730A',AMARILLO:'#C79A00',VERDE:'#2E8B57'};
var COL_EST={'G1':'#3E8A96','G2':'#0E5C68','G3':'#08414A','PENDIENTE':'#B9C0CC'};
var _conteoAnim=false;

document.querySelectorAll('.chip-filtro').forEach(function(ch){
  ch.addEventListener('click',function(){ch.classList.toggle('on');renderizarTodo();});
});
['fDesde','fHasta'].forEach(function(id){
  document.getElementById(id).addEventListener('change',renderizarTodo);
});

function activos(){return SECTORES.filter(function(s){
  return document.querySelector('.chip-filtro[data-s="'+s+'"]').classList.contains('on');});}
function paxFiltrados(){var s=activos();return D.pacientes.filter(function(p){return s.indexOf(p.sector)!==-1;});}
function evFiltrados(){var s=activos();return D.eventos.filter(function(e){return s.indexOf(e.sector)!==-1;});}
function esPendiente(est){est=String(est||'').trim().toUpperCase();return est===''||est==='G'||est==='PENDIENTE';}

function animNum(el,val,sufijo){
  sufijo=sufijo||'';
  if(_conteoAnim){el.textContent=val+sufijo;return;}
  var t0=null,dur=600;
  function paso(ts){if(!t0)t0=ts;var k=Math.min((ts-t0)/dur,1);
    el.textContent=Math.round(val*(1-Math.pow(1-k,3)))+sufijo;
    if(k<1)requestAnimationFrame(paso);}
  requestAnimationFrame(paso);
}

function renderizarTodo(){
  var pax=paxFiltrados(),evs=evFiltrados();

  /* --- KPIs --- */
  animNum(document.getElementById('kTotal'),pax.length);
  var pend=pax.filter(function(p){return esPendiente(p.est);}).length;
  animNum(document.getElementById('kPend'),pax.length?Math.round(100*pend/pax.length):0,'%');
  var hoy=new Date(),mesAct=hoy.getFullYear()+'-'+String(hoy.getMonth()+1).padStart(2,'0');
  var mesAnt=new Date(hoy.getFullYear(),hoy.getMonth()-1,1);
  var mesAntK=mesAnt.getFullYear()+'-'+String(mesAnt.getMonth()+1).padStart(2,'0');
  var ingMes=evs.filter(function(e){return e.tipo==='INGRESO'&&e.f.slice(0,7)===mesAct;}).length;
  var ingAnt=D.eventos.filter(function(e){return e.tipo==='INGRESO'&&e.f.slice(0,7)===mesAntK&&activos().indexOf(e.sector)!==-1;}).length;
  animNum(document.getElementById('kIng'),ingMes);
  var d=document.getElementById('kIngD');
  if(ingAnt>0){var pct=Math.round(100*(ingMes-ingAnt)/ingAnt);
    d.textContent=(pct>=0?'▲ +':'▼ ')+pct+'% vs mes anterior';d.className='delta '+(pct>=0?'up':'down');}
  else{d.textContent='sin base de comparación';d.className='delta neu';}
  animNum(document.getElementById('kRev'),pax.filter(function(p){return p.rev;}).length);

  var conteoPat={};
  pax.forEach(function(p){String(p.cond||'').split(';').forEach(function(c){
    if(c)conteoPat[c]=(conteoPat[c]||0)+1;});});
  var topCod=null,topN=0;
  Object.keys(conteoPat).forEach(function(c){if(conteoPat[c]>topN){topN=conteoPat[c];topCod=c;}});
  var nom=topCod&&D.catalogo[topCod]?D.catalogo[topCod]:topCod;
  document.getElementById('kPat').textContent=nom?('⚠ '+nom):'Sin datos';
  document.getElementById('kPat').style.color=nom?'var(--text-primary)':'var(--text-muted)';
  document.getElementById('kPatC').textContent=nom?(topN+' paciente'+(topN>1?'s':'')):'';

  /* --- Donut sector --- */
  grafico('chSector','doughnut',{
    labels:SECTORES.map(function(s){return s.charAt(0)+s.slice(1).toLowerCase();}),
    datasets:[{data:SECTORES.map(function(s){return pax.filter(function(p){return p.sector===s;}).length;}),
      backgroundColor:SECTORES.map(function(s){return COL_SEC[s];}),borderWidth:2,borderColor:'#fff'}]
  });

  /* --- Barra estratificación (escala primaria, nunca semáforo) --- */
  var orden=['G1','G2','G3','PENDIENTE'];
  grafico('chEst','bar',{labels:orden.map(function(o){return o==='PENDIENTE'?'Pendiente':o;}),
    datasets:[{data:orden.map(function(o){return pax.filter(function(p){
      return o==='PENDIENTE'?esPendiente(p.est):String(p.est||'').trim().toUpperCase()===o;}).length;}),
      backgroundColor:orden.map(function(o){return COL_EST[o];}),borderRadius:6}]},{y:{beginAtZero:true,precision:0}});

  /* --- Línea ingresos por mes dentro del rango --- */
  var desde=document.getElementById('fDesde').value,hasta=document.getElementById('fHasta').value;
  var meses=[],cursor=new Date(desde+'T00:00:00'),fin=new Date(hasta+'T00:00:00');
  while(cursor<=fin&&meses.length<24){
    var k=cursor.getFullYear()+'-'+String(cursor.getMonth()+1).padStart(2,'0');
    meses.push(k);cursor.setMonth(cursor.getMonth()+1);}
  var serie=meses.map(function(k){return evs.filter(function(e){
    return e.tipo==='INGRESO'&&e.f.slice(0,7)===k;}).length;});
  grafico('chIng','line',{labels:meses.map(function(k){var p=k.split('-');return p[1]+'/'+p[0].slice(2);}),
    datasets:[{data:serie,borderColor:'#0E5C68',backgroundColor:'rgba(14,92,104,.10)',
      fill:true,tension:.35,pointRadius:3}]},{y:{beginAtZero:true,precision:0}});

  /* --- Top patologías --- */
  var pares=Object.keys(conteoPat).map(function(c){return {c:c,n:conteoPat[c]};})
    .sort(function(a,b){return b.n-a.n;}).slice(0,8);
  if(!pares.length){
    if(CH.chPat){CH.chPat.destroy();delete CH.chPat;}
    document.getElementById('chPat').parentElement.innerHTML=
      '<div class="vacio"><i data-lucide="inbox"></i>Sin pacientes en la selección actual</div>';
  }else{
    grafico('chPat','bar',{labels:pares.map(function(x){return D.catalogo[x.c]||x.c;}),
      datasets:[{data:pares.map(function(x){return x.n;}),
        backgroundColor:'#E5F1F2',borderColor:'#0E5C68',borderWidth:1.5,borderRadius:6}]},
      {indexAxis:'y',x:{beginAtZero:true,precision:0},y:{ticks:{font:{size:11}}}},true);
  }
  _refrescarIconos();_conteoAnim=true;
}

function grafico(id,tipo,data,opts,horizontal){
  opts=opts||{};
  Chart.defaults.font.family='Inter';
  if(CH[id]){CH[id].destroy();}
  CH[id]=new Chart(document.getElementById(id),{type:tipo,
    data:data,options:Object.assign({responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:tipo==='doughnut',position:'right'}},indexAxis:horizontal?'y':undefined},opts)});
}

google.script.run.withSuccessHandler(function(r){
  ['kTotal','kPend','kIng','kRev'].forEach(function(id){
    document.getElementById(id).textContent='…';});
  if(!r||!r.ok){toast(r?r.motivo:'Sin respuesta','err');return;}
  D=r;D.catalogoObj={};(r.catalogo||[]).forEach(function(c){D.catalogoObj[c.codigo]=c.nombre;});
  D.catalogo=D.catalogoObj;
  var hoy=new Date();
  document.getElementById('fDesde').value=new Date(hoy.getFullYear()-1,hoy.getMonth(),hoy.getDate()).toISOString().slice(0,10);
  document.getElementById('fHasta').value=hoy.toISOString().slice(0,10);
  document.getElementById('chipGen').textContent='Generado '+_fmtFecha(r.generadoEn);
  renderizarTodo();_refrescarIconos();
}).withFailureHandler(function(e){toast('Error cargando datos: '+(e&&e.message||e),'err');})
.api_dashboardDatos();
_refrescarIconos();
</script>
</body>
</html>
