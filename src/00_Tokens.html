     declarar data-ecicep-fuentes="sora" (solo Sora, p.ej. la Web App que no usa
     Inter) o "none" (sin fuentes). Evita descargar webfonts que la página no usa. -->
<script>
(function () {
  var attr = document.documentElement.getAttribute('data-ecicep-fuentes') || 'all';
  var href;
  if (attr === 'sora') href = 'https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap';
  else if (attr === 'all') href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap';
  if (href) {
    var l = document.createElement('link');

<script>
/* Helpers compartidos (vanilla, sin dependencias salvo Lucide opcional) */
function _esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function _debounce(fn,ms){var t;return function(){clearTimeout(t);var a=arguments,c=this;t=setTimeout(function(){fn.apply(c,a);},ms||220);};}
function _fmtFecha(iso){ /* SIEMPRE DD/MM/AAAA — parseo manual, nunca new Date('US') */
  var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||''));
  return m? m[3]+'/'+m[2]+'/'+m[1] : '';
}
function _rel(fechaIso){ /* "hace n días" + exacta para tooltip */
  var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(fechaIso||'')); if(!m)return '';
  var f=new Date(+m[1],+m[2]-1,+m[3]),h=new Date(),d=Math.round((h-f)/864e5);
  if(d===0)return 'hoy';if(d===1)return 'ayer';if(d===-1)return 'mañana';
  return d>0?('hace '+d+' días'):('en '+(-d)+' días');
}
function _chipSector(sec){
  var s=_esc(sec||'desconocido').toUpperCase();
  var cls={NARANJO:'naranjo',AMARILLO:'amarillo',VERDE:'verde'}[s]||'desconocido';
  return '<span class="chip chip-sec-'+cls+'">'+ (s==='DESCONOCIDO'?'—':s.charAt(0)+s.slice(1).toLowerCase()) +'</span>';
}
/* Estratificación: ●●● dirección confirmada — G3 = mayor severidad (3+ patologías).
   Pendiente/vacío/G → contorno punteado gris + reloj, SIN relleno de semáforo. */
function _estIndicador(v){
  var t=String(v==null?'':v).trim().toUpperCase();
  if(t==='G1'||t==='G2'||t==='G3'){
    var n=+t[1],dots='';for(var i=1;i<=3;i++)dots+=(i<=n?'●':'○');
    return '<span class="chip chip-est" title="'+t+' · severidad '+(t==='G3'?'alta':t==='G2'?'media':'inicial')+'">'+
      '<span class="est-dots">'+dots+'</span> '+t+'</span>';
  }
  return '<span class="chip chip-est est-pendiente" title="Sin estratificación confirmada">'+
    '<i data-lucide="clock"></i> Pendiente</span>';
}
function _refrescarIconos(){ if(window.lucide&&lucide.createIcons)lucide.createIcons(); }
function toast(msg,tipo){ /* reemplaza alert(): ok|err|info|warn, auto 4s (err 8s) */
  var z=document.getElementById('toastZone');
  if(!z){z=document.createElement('div');z.id='toastZone';document.body.appendChild(z);}
  while(z.children.length>=4){z.removeChild(z.firstChild);}
  var t=(tipo==='ok'||tipo==='err'||tipo==='warn')?tipo:'info';
  var el=document.createElement('div');
  el.className='toast '+t;
  el.setAttribute('role',t==='err'?'alert':'status');
  el.setAttribute('aria-live',t==='err'?'assertive':'polite');
  var ic=t==='ok'?'check-circle':t==='err'?'alert-circle':t==='warn'?'alert-triangle':'info';
  var glyph=t==='ok'?'\u2713':t==='err'?'\u2715':t==='warn'?'\u26A0':'';
  el.innerHTML='<span class="t-ic"><i data-lucide="'+ic+'"></i></span><span>'+_esc(msg)+'</span>';
  el.title='Clic para cerrar';
  el.addEventListener('click',function(){el.classList.add('salida');setTimeout(function(){el.remove();},200);});
  z.appendChild(el);_refrescarIconos();
  if(!window.lucide){ /* páginas sin Lucide (Web App): glifo de texto o sin icono */
    var iEl=el.querySelector('.t-ic');
    if(iEl){ if(glyph){iEl.textContent=glyph;iEl.style.fontSize='13px';iEl.style.lineHeight='1';}
             else iEl.style.display='none'; }
  }
  setTimeout(function(){el.classList.add('salida');setTimeout(function(){el.remove();},260);},
             t==='err'?8000:4000);
}
/* Estado de carga de botón: spinner inline + deshabilitado mientras corre google.script.run */
function _btnCargando(btn,texto){
  if(!btn)return null;
  btn._htmlPrev=btn.innerHTML;btn.disabled=true;
  btn.innerHTML='<span class="spin"></span> '+_esc(texto||'Guardando…');
  return function(){btn.disabled=false;btn.innerHTML=btn._htmlPrev;_refrescarIconos();};
}
/* API central #2: setLoading(btn,true|false) — un solo camino para todos los botones */
function setLoading(btn,on,texto){
  if(on){return _btnCargando(btn,texto||'Procesando…');}
  if(btn&&typeof btn._htmlPrev!=='undefined'){btn.disabled=false;btn.innerHTML=btn._htmlPrev;
    delete btn._htmlPrev;_refrescarIconos();}
}
/* Para openers cuyo completion no es observable (ej: abrir un dialog cancela
   el RPC): pulso con auto-restauración garantizada. Nunca queda pegado. */
function _btnPulso(btn,texto,ms){
  var fin=setLoading(btn,true,texto);
  setTimeout(function(){setLoading(btn,false);},ms||1600);
  return fin;

/* Anti doble-clic universal (DEC-VI): guarda global para que ningún botón
   dispare dos RPCs concurrentes. Uso: onclick="return _guardarBot(this)"
   o envuelve la función: onclick="return _guardarBot(this)&&miFn(this)".
   Deshabilitado en cuanto el RPC regresa (success o failure). */
function _guardarBot(btn,texto){
  if(!btn||btn.disabled)return false;
  btn.disabled=true;
  btn._htmlPrev=btn.innerHTML;
  btn.innerHTML='<span class="spin"></span> '+_esc(texto||'Procesando…');
  return true;
}
/* Restaura un botón protegido con _guardarBot (llamar en success/failure). */
function _restaurarBot(btn){
  if(btn&&typeof btn._htmlPrev!=='undefined'){
    btn.disabled=false;btn.innerHTML=btn._htmlPrev;
    delete btn._htmlPrev;_refrescarIconos();
  }
}
/* Guarda global anti doble-clic por delegación (DEC-VII): captura cualquier
   click sobre un <button> y lo deshabilita al instante para evitar RPCs
   concurrentes. Los manejadores que ya usan _btnCargando/setLoading gestionan
   su propio spinner y restauración; aquí solo reforzamos la barrera inicial y
   re-habilitamos de forma segura tras un lapso, sin pisar su HTML. */
(function(){
  document.addEventListener('click',function(ev){
    var btn=ev.target&&ev.target.closest?ev.target.closest('button'):null;
    if(!btn||btn.disabled)return;
    /* No intervenir en toggles de pestañas/acordeones ni menús externos */
    if(btn.classList.contains('mini-link')
       ||btn.closest('.opciones-head,.collap-header,details,.tab,.guia-panel'))return;
    btn.disabled=true;              /* bloquea doble-clic inmediato */
    setTimeout(function(){         /* re-habilita solo si NADIE gestiona el estado */
      if(btn&&typeof btn._htmlPrev==='undefined'&&!btn.closest('.opciones-head,.collap-header,details,.tab')){
        btn.disabled=false;
      }
    },900);
  },true);
})();

/* ── Guía interactiva (ECICEP_guia). Reutilizable en cualquier panel:
 *   ECICEP_guia([
 *     {sel:'#campoId', titulo:'Paso 1', texto:'Explicación...'}, ...
 *   ], { volverAlOrigen:true });
 * Atenuación parcial (mask clara) + spotlight sobre el objetivo + panel
 * lateral derecho con navegación, réplica interactiva del control real
 * (espejo bidireccional) y "Resultado actual" en vivo. No-op sin pasos, sin

var ECICEP_guia = (function () {

  var syncLock = false;
  function _el(tag, cls) {

    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  function emitir(ctl, ev) {
    try {
      ctl.dispatchEvent(new (window.Event || window.CustomEvent)(ev, { bubbles: true }));
    } catch (e) {

    }

    return ctl.tagName === 'BUTTON' || ctl.type === 'submit' || ctl.type === 'button';
  }
  function esOculto(el) {
    if (!el || el.nodeType !== 1) return true;
    var c = el;
    while (c && c.nodeType === 1) {
      if (c.hidden) return true;
      var _cs = (typeof getComputedStyle === 'function') ? getComputedStyle(c) : null;

  function controlObjetivo(paso) {
    var t = paso.sel ? document.querySelector(paso.sel) : (paso.el || null);
    if (!t) return null;
    if (t.tagName === 'LABEL' && t.htmlFor) t = document.getElementById(t.htmlFor) || t;
    if (t.tagName && /^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(t.tagName)) return t;
