<!DOCTYPE html>
<html>
<head>
<base target="_top">
<?!= include('00_Tokens') ?>
<style>
body{font-size:15px;padding:var(--space-5);background:var(--surface);
  display:flex;flex-direction:column;min-height:90vh;box-sizing:border-box}
.marca{text-align:center;margin-bottom:var(--space-4)}
.marca .sys{font:700 24px 'Sora';color:var(--primary)}
.marca .sub{font-size:13px;color:var(--text-muted)}
.barra{height:12px;background:var(--surface-alt);border-radius:var(--radius-full);
  overflow:hidden;border:1px solid var(--border);margin:var(--space-3) 0}
.barra>span{display:block;height:100%;width:0;background:var(--primary);
  border-radius:var(--radius-full);transition:width .5s var(--ease-in)}
.pct{text-align:center;font:700 15px 'Sora';color:var(--primary);margin-bottom:var(--space-2)}
.etapa-actual{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);
  margin-bottom:var(--space-3);min-height:20px}
.etapa-actual .spin{width:14px;height:14px;border:2px solid var(--primary);
  border-top-color:transparent;border-radius:50%;display:inline-block;animation:girar .7s linear infinite}
.lista{flex:1;overflow:auto;font-size:13.5px}
.item{display:flex;align-items:center;gap:9px;padding:6px 4px;border-bottom:1px solid var(--surface-alt)}
.item .ic{width:18px;text-align:center;flex-shrink:0}
.item.ok .ic{color:var(--success)} .item.err .ic{color:var(--danger)}
.item.run .ic{color:var(--primary)} .item.pen .ic{color:var(--border-strong)}
.item.skip .ic{color:var(--text-muted)} .item.skip{color:var(--text-muted)}
.item.err{color:var(--danger)}
.final{text-align:center;display:none}
.final .big-check{font-size:44px;color:var(--success);line-height:1}
.final h2{font:700 20px 'Sora';margin:8px 0 2px;color:var(--text-primary)}
.final .ver{font:600 13px 'Inter';color:var(--text-secondary)}
.final .pruebas{font-size:12px;color:var(--text-muted);margin-top:4px}
.aviso-final{background:var(--warning);color:#fff;border-radius:var(--radius-md);
  padding:8px 12px;font-size:12.5px;margin-top:var(--space-3);display:none;text-align:left}
.botones{display:none;gap:10px;margin-top:var(--space-4)}
.botones .btn{flex:1;justify-content:center}
.pie{text-align:center;font-size:11px;color:var(--text-muted);margin-top:auto;padding-top:var(--space-3)}
#btnCancelarWrap{display:none;margin-top:var(--space-2)}
#btnCancelarWrap .btn{width:100%;justify-content:center}
.preparacion{display:none;text-align:center;margin:var(--space-4) 0}
.preparacion p{color:var(--text-secondary);line-height:1.5}
.preparacion .btn{margin-top:var(--space-2)}
</style>
</head>
<body data-acceso="<?= TOKEN_ACCESO ?>" data-portal="<?= PORTAL_URL ?>">
<script>var VER='v<?= ECICEP.VERSION ?>';var BUILD='<?= BUILD ?>';</script>
<div class="marca">
  <div class="sys">ECICEP</div>
  <div class="sub">Instalación y reparación del sistema</div>
</div>

<div class="preparacion" id="preparacion">
  <p id="diagResumen">Revisando el estado del sistema…</p>
  <button class="btn btn-pri" id="btnIniciar" onclick="iniciarInstalacion()">Instalar / reparar</button>
</div>
<div class="pct" id="pct">0%</div>
<div class="barra"><span id="fill"></span></div>
<div class="etapa-actual" id="etapaActual">
  <span class="spin"></span><span id="etapaTxt">Preparando…</span>
</div>
<div id="btnCancelarWrap">
  <button class="btn btn-ghost" onclick="cancelarInstalacion()">Detener proceso</button>
</div>

<div class="lista" id="lista"></div>

<div class="final" id="final">
  <div class="big-check">✓</div>
  <h2>SISTEMA ACTUALIZADO</h2>
  <div class="ver" id="finVer"></div>
  <div class="pruebas" id="finDatos"></div>
  <div class="aviso-final" id="finAvisos"></div>
  <div class="botones" style="display:flex">
    <button class="btn btn-pri" onclick="cerrarVista()">Continuar</button>
  </div>
</div>

<div class="pie" id="pie">El diagnóstico no modifica datos.</div>

<script src="https://unpkg.com/lucide@0.294.0/dist/umd/lucide.min.js"></script>
<script>
var ETAPAS=[],RESULTADOS=[],ERRORES=[],_CANCELADO=false,_enCurso=false,_EJEC='';
var ECICEP_ACCESO=document.body.getAttribute('data-acceso')||'';
var ECICEP_PORTAL=document.body.getAttribute('data-portal')||'';
var ICON={ok:'✓',run:'●',pen:'○',err:'✕',skip:'—'};
/* Progreso = etapas terminadas / etapas totales; las etapas omitidas no inflan el avance. */
function pesoTotal(){return ETAPAS.length||1;}
/* Token de ejecución de instalación: identifica un correr completo del cliente
   ante el servidor para crear UN respaldo previo por ejecución (B4). */
function nuevoEjecucion(){return 'INST-'+Date.now().toString(36)+'-'+Math.floor(Math.random()*1296).toString(36);}

function cancelarInstalacion(){
  if(_CANCELADO)return;
  _CANCELADO=true;
  document.getElementById('btnCancelarWrap').style.display='none';
  document.getElementById('etapaTxt').textContent=_enCurso
    ? 'Se detendrá al terminar la etapa actual. Espera antes de cerrar.'
    : 'Proceso detenido. Puedes cerrar esta ventana.';
}

function cerrarVista(){
  if(ECICEP_PORTAL){window.open(ECICEP_PORTAL,'_blank','noopener,noreferrer');return;}
  google.script.host.close();
}

function cargarDiagnostico(){
  google.script.run.withSuccessHandler(function(r){
    var pendientes=r&&r.ok&&r.diagnostico&&r.diagnostico.resumen
      ? r.diagnostico.resumen.fasesPendientes : null;
    var bloqueo=r&&r.diagnostico&&r.diagnostico.versionado
      ? r.diagnostico.versionado.bloqueo : '';
    document.getElementById('btnIniciar').disabled=!!bloqueo||!!(r&&r.motivo==='ACCESO_DENEGADO');
    document.getElementById('diagResumen').textContent=pendientes
      ? (bloqueo ? 'Instalación bloqueada por esquema incompatible: '+bloqueo+'. Requiere revisión técnica.'
        : pendientes.length ? 'Se detectaron '+pendientes.length+' áreas pendientes: '+pendientes.join('; ')+'.'
        : 'El sistema está al día. Puedes ejecutar una reparación si es necesario.')
      : r&&r.motivo==='ACCESO_DENEGADO'
        ? 'El enlace de acceso no es válido. Solicita uno actualizado desde Captura.'
        : 'No se pudo completar el diagnóstico. Puedes intentar la reparación manualmente.';
    document.getElementById('preparacion').style.display='block';
    document.getElementById('etapaActual').style.display='none';
  }).withFailureHandler(function(e){
    document.getElementById('diagResumen').textContent='Diagnóstico no disponible: '+(e&&e.message||e);
    document.getElementById('preparacion').style.display='block';
    document.getElementById('etapaActual').style.display='none';
  }).api_instalarDiagnostico(ECICEP_ACCESO);
}

function iniciarInstalacion(){
  if(_enCurso||!ETAPAS.length)return;
  _CANCELADO=false;RESULTADOS=[];ERRORES=[];_EJEC=nuevoEjecucion();
  ETAPAS.forEach(function(e){marcar(e.id,'pen');});
  document.getElementById('final').style.display='none';
  document.getElementById('btnCancelarWrap').style.display='none';
  document.getElementById('preparacion').style.display='none';
  document.getElementById('etapaActual').style.display='flex';
  document.getElementById('pie').textContent='Espera a que termine la etapa actual antes de cerrar.';
  ejecutarSecuencia(0);
}

function cargarEtapas(){
  google.script.run.withSuccessHandler(function(r){
    if(!r||!r.ok){document.getElementById('etapaTxt').textContent='Error cargando etapas';return;}
    ETAPAS=r.etapas||[];
    var L=document.getElementById('lista');
    L.innerHTML=ETAPAS.map(function(e){
      return '<div class="item pen" id="it_'+e.id+'"><span class="ic">'+ICON.pen+'</span>'+
        '<span>'+e.nombre+'</span></div>';
    }).join('');
    cargarDiagnostico();
  }).withFailureHandler(function(e){
    document.getElementById('etapaTxt').textContent='Error: '+(e&&e.message||e);
  }).api_instalarEtapas(ECICEP_ACCESO);
}

function marcar(id,estado){
  var el=document.getElementById('it_'+id);
  if(el){el.className='item '+estado;
    el.querySelector('.ic').textContent=ICON[estado]||'○';}
}

function ejecutarSecuencia(ix){
  if(_CANCELADO)return;
  if(ix>=ETAPAS.length){finalizar();return;}
  var etapa=ETAPAS[ix];
  _enCurso=true;
  document.getElementById('btnCancelarWrap').style.display='block';
  marcar(etapa.id,'run');
  var et=document.getElementById('etapaTxt');
  et.textContent='Instalando ECICEP…';
  et.setAttribute('data-etapa',etapa.nombre);
  var hecho=RESULTADOS.length;
  var pct=Math.round((hecho/pesoTotal())*100);
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('fill').style.width=pct+'%';

  google.script.run.withSuccessHandler(function(r){
    _enCurso=false;
    if(_CANCELADO){
      document.getElementById('btnCancelarWrap').style.display='none';
      document.getElementById('etapaTxt').textContent='Proceso detenido. Ejecuta nuevamente para verificar el estado.';
      cargarDiagnostico();
      return;
    }
    if(!r||r.ok===false){
      marcar(etapa.id,'err');
      ERRORES.push({etapa:etapa.id,nombre:etapa.nombre,motivo:(r&&(r.motivo||r.linea))||'error'});
      document.getElementById('etapaTxt').textContent='✕ No se pudo completar la instalación.';
      document.getElementById('btnCancelarWrap').style.display='none';
      mostrarFinal(false); /* pantalla de error con reintentar */
      return;
    }
    marcar(etapa.id,r.omitida?'skip':'ok');
    RESULTADOS.push(r);
    ejecutarSecuencia(ix+1); /* progreso REAL: solo avanza al completar la etapa */
  }).withFailureHandler(function(e){
    _enCurso=false;
    if(_CANCELADO){
      document.getElementById('btnCancelarWrap').style.display='none';
      document.getElementById('etapaTxt').textContent='Proceso detenido. Ejecuta nuevamente para verificar el estado.';
      cargarDiagnostico();
      return;
    }
    marcar(etapa.id,'err');
    ERRORES.push({etapa:etapa.id,nombre:etapa.nombre,motivo:(e&&e.message)||e});
    document.getElementById('etapaTxt').textContent='✕ No se pudo completar la instalación.';
    document.getElementById('btnCancelarWrap').style.display='none';
    mostrarFinal(false);
  }).api_instalarPaso(etapa.id,ECICEP_ACCESO,_EJEC);
}

function reintentarDesde(ix){
  ERRORES=ERRORES.filter(function(e){return e.etapa!==ETAPAS[ix].id;});
  marcar(ETAPAS[ix].id,'pen');
  ejecutarSecuencia(ix);
}

function mostrarFinal(ok){
  var pct=ok?100:Math.round((RESULTADOS.length/ETAPAS.length)*100);
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('fill').style.width=pct+'%';
  document.getElementById('etapaActual').style.display=ok?'none':'flex';
  if(!ok){
    var er=ERRORES[ERRORES.length-1];
    var et=document.getElementById('etapaTxt');
    et.textContent='✕ No se pudo completar la instalación.';
    var det=document.createElement('br');
    et.appendChild(det);
    et.append('Fase: '+er.nombre+' · Detalle: '+er.motivo);
    var L=document.getElementById('lista');
    var btn=document.createElement('button');
    btn.className='btn btn-pri';btn.style.width='100%';btn.style.marginTop='8px';
    btn.innerHTML='↻ Reintentar etapa';
    btn.onclick=function(){
      var ix=ETAPAS.findIndex(function(e){return e.id===er.etapa;});
      L.removeChild(btn);reintentarDesde(ix);
    };
    L.appendChild(btn);
    return;
  }
  document.getElementById('finVer').textContent='ECICEP '+VER+' \u00b7 Build '+BUILD;
  var datos=RESULTADOS.filter(function(x){return x.etapa==='verificar';})[0];
  var enr=RESULTADOS.filter(function(x){return x.etapa==='enriquecimiento';})[0];
  var mig=RESULTADOS.filter(function(x){return x.etapa==='migraciones';})[0];
  var txt='';
  if(datos)txt+='Pacientes: '+datos.pacientes+' · Eventos: '+datos.eventos;
  if(datos&&datos.schemaVersion)
    txt+=(txt?' · ':'')+'Esquema: v'+datos.schemaVersion+(datos.esquemaOK?' ✓':' ('+datos.estado+')');
  if(enr){
    if(txt)txt+=' · ';
    txt+='Revisados: '+(enr.revisados||0)+'/'+(enr.totalPacientes||0)
      +' · Actualizados: '+(enr.enriquecidos||0)+' ('+(enr.aplicados||0)+' campos)';
    if(enr.sinCambios)txt+=' · Sin cambio: '+(enr.sinCambios||0);
    if(enr.sinVacias)txt+=' · Sin huecos: '+(enr.sinVacias||0);
    if(enr.conflictos)txt+=' · Revisión: '+(enr.conflictos||0);
    if(enr.noEncontrados)txt+=' · Sin fuente: '+(enr.noEncontrados||0);
    txt+=' · Errores: '+(enr.errores||0);
  }
  if(mig){
    var migTxt=(mig.aplicadas&&mig.aplicadas.length)
      ? mig.aplicadas.join(', ')+' (esquema '+mig.versionInicial+'→'+mig.versionFinal+')'
      : 'sin pendientes';
    txt+=(txt?' · ':'')+'Migraciones: '+migTxt;
  }
  var omitidas=RESULTADOS.filter(function(x){return x.omitida;}).length;
  if(omitidas)txt+=(txt?' · ':'')+'Etapas omitidas: '+omitidas;
  var limpieza=RESULTADOS.filter(function(x){return x.etapa==='limpieza';})[0];
  if(limpieza&&limpieza.candidatas&&limpieza.candidatas.length)
    txt+=(txt?' · ':'')+'Hojas adicionales conservadas: '+limpieza.candidatas.length;
  document.getElementById('finDatos').textContent=txt;
  var av=document.getElementById('finAvisos');
  if(ERRORES.length){av.style.display='block';
    av.textContent='⚠ Completado con avisos: '+ERRORES.map(function(e){
      return '· '+e.nombre+': '+e.motivo;}).join('; ');}
  document.getElementById('final').style.display='block';
  _refrescarIconos();
}

function finalizar(){
  document.getElementById('pct').textContent='100%';
  document.getElementById('fill').style.width='100%';
  document.getElementById('etapaActual').style.display='none';
  mostrarFinal(true);
}

cargarEtapas();
_refrescarIconos();
</script>
</body>
</html>
