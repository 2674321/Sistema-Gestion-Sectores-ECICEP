<section class="sec" id="editorPaciente" hidden aria-label="Actualizar ficha del paciente">
  <div class="ed-hero">
    <div class="ed-hero-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/><path d="m15 5 3 3"/></svg>
    </div>
    <div>
      <span class="ed-eyebrow">Actualización completa</span>
      <h3>Ficha del paciente</h3>
      <p>Carga los datos actuales, modifica lo necesario y revisa el resumen antes de enviar.</p>
    </div>
  </div>
  <ol class="ed-pasos" aria-label="Pasos para actualizar">
    <li><span>1</span>Ingresa el RUT</li>
    <li><span>2</span>Carga la ficha</li>
    <li><span>3</span>Edita los datos</li>
    <li><span>4</span>Envía los cambios</li>
  </ol>
  <div class="ed-carga">
    <div class="ed-carga-texto"><strong>¿RUT listo?</strong><span>La consulta no modifica ningún dato.</span></div>
    <button type="button" class="btn ed-cargar-btn" id="edCargar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <span>Cargar ficha</span>
    </button>
  </div>
  <p id="edEstado" class="ed-status ed-status-idle" role="status" aria-live="polite">Carga la ficha para editarla.</p>
  <div id="edCampos" hidden></div>
  <p id="edResumen" class="ed-resumen" role="status" aria-live="polite"></p>
</section>
<style>
#editorPaciente[hidden],#edCampos[hidden]{display:none!important}
#editorPaciente{margin-top:var(--sp-2);overflow:visible}
.ed-hero{display:flex;gap:var(--sp-3);align-items:flex-start;padding:var(--sp-4);border:1px solid #b9d9de;border-radius:var(--r-lg);background:linear-gradient(135deg,#f1fbfc 0%,#fff 72%)}
.ed-hero-icon{display:flex;align-items:center;justify-content:center;width:42px;height:42px;flex:0 0 42px;border-radius:12px;background:var(--c-primary-mid);color:#fff;box-shadow:0 4px 12px rgba(14,92,104,.2)}
.ed-hero-icon svg{width:22px;height:22px}.ed-eyebrow{display:block;margin-bottom:2px;color:var(--c-primary-mid);font-size:var(--fs-xs);font-weight:var(--fw-bold);letter-spacing:.06em;text-transform:uppercase}
.ed-hero h3{margin:0;color:var(--c-primary);font-size:var(--fs-lg);line-height:1.25}.ed-hero p{margin:4px 0 0;color:var(--c-text-2);font-size:var(--fs-sm);line-height:1.45}
.ed-pasos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:var(--sp-3) 0;padding:0;list-style:none}
.ed-pasos li{display:flex;align-items:center;gap:6px;min-width:0;padding:7px 8px;border-radius:var(--r-sm);background:var(--c-surface-alt);color:var(--c-text-2);font-size:10px;font-weight:var(--fw-semibold);line-height:1.2}
.ed-pasos li span{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;flex:0 0 20px;border-radius:50%;background:#dceff2;color:var(--c-primary);font-size:10px;font-weight:var(--fw-bold)}
.ed-carga{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-3);border:1px solid var(--c-border-light);border-radius:var(--r-md);background:#fff;box-shadow:var(--sh-sm)}
.ed-carga-texto{display:flex;flex-direction:column;min-width:0}.ed-carga-texto strong{font-size:var(--fs-sm);color:var(--c-text)}.ed-carga-texto span{font-size:var(--fs-xs);color:var(--c-text-3)}
.ed-cargar-btn{flex:0 0 auto;background:var(--c-primary-mid);color:#fff;box-shadow:var(--sh-sm);padding-left:var(--sp-4);padding-right:var(--sp-4)}
.ed-cargar-btn:hover:not(:disabled){background:var(--c-primary);box-shadow:var(--sh-md)}.ed-cargar-btn:focus-visible{outline:2px solid var(--c-focus);outline-offset:2px}.ed-cargar-btn svg{width:17px;height:17px}
.ed-status{margin:var(--sp-3) 0 0;padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--c-border-light);font-size:var(--fs-sm);font-weight:var(--fw-medium);line-height:1.4}
.ed-status-idle{background:var(--c-surface-alt);color:var(--c-text-2)}.ed-status-loading{background:#edf8fa;border-color:#b9d9de;color:var(--c-primary-mid)}.ed-status-ok{background:var(--c-ok-bg);border-color:var(--c-ok-border);color:var(--c-ok)}.ed-status-error{background:var(--c-err-bg);border-color:var(--c-err-border);color:var(--c-err)}
.ed-grupo{min-width:0;margin:var(--sp-4) 0 0;padding:var(--sp-4);border:1px solid var(--c-border-light);border-radius:var(--r-lg);background:#fff;box-shadow:var(--sh-sm)}
.ed-grupo legend{padding:0 8px;color:var(--c-primary);font-size:var(--fs-sm);font-weight:var(--fw-bold);letter-spacing:.01em}
.ed-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-3)}
.ed-campo{min-width:0;padding:10px;border-radius:var(--r-md);background:var(--c-surface-alt);border:1px solid transparent;transition:border-color var(--transition),background-color var(--transition),box-shadow var(--transition)}
.ed-campo:focus-within{border-color:#b9d9de;background:#fff;box-shadow:0 0 0 3px var(--c-focus-ring)}
.ed-campo .f-label{color:var(--c-primary)}.ed-ancho{grid-column:1/-1}
.ed-campo .f-input,.ed-campo .f-select,.ed-atencion .f-input,.ed-atencion .f-select{width:100%;min-height:42px;padding:var(--sp-2) var(--sp-3);border:1.5px solid var(--c-border);border-radius:var(--r-sm);background:#fff;color:var(--c-text);font:inherit;outline:none}
.ed-campo .f-input:focus,.ed-campo .f-select:focus,.ed-atencion .f-input:focus,.ed-atencion .f-select:focus{border-color:var(--c-focus);box-shadow:0 0 0 3px var(--c-focus-ring)}
.ed-campo textarea.f-input{resize:vertical;min-height:86px}.ed-patologias{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:270px;overflow:auto;padding:4px}
.ed-patologias label{display:flex;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--c-border-light);border-radius:var(--r-sm);background:#fff;color:var(--c-text-2);font-size:var(--fs-sm);cursor:pointer}
.ed-patologias label:hover{border-color:#b9d9de;background:#f4fbfc}.ed-patologias input{accent-color:var(--c-primary-mid);width:16px;height:16px;flex:0 0 16px}
.ed-atenciones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-3)}.ed-atencion{margin:0;padding:var(--sp-3);border:1px solid var(--c-border-light);border-radius:var(--r-md);background:var(--c-surface-alt)}
.ed-atencion-titulo{margin:0 0 var(--sp-3);padding-bottom:var(--sp-2);border-bottom:1px solid var(--c-border-light);color:var(--c-text-2);font-size:var(--fs-sm);font-weight:var(--fw-semibold)}.ed-atencion .f-label:not(:first-child){margin-top:var(--sp-3)}
.ed-cambio{border-color:var(--c-primary-light)!important;background:#f2fbfc!important;box-shadow:0 0 0 2px rgba(27,122,138,.12)!important}
.ed-resumen{display:none;position:sticky;bottom:8px;z-index:4;margin:var(--sp-4) 0 0;padding:11px 14px;border:1px solid var(--c-border);border-radius:999px;background:rgba(255,255,255,.96);box-shadow:var(--sh-md);color:var(--c-text-2);font-size:var(--fs-sm);font-weight:var(--fw-semibold);text-align:center;backdrop-filter:blur(6px)}
.ed-resumen.ed-resumen-visible{display:block}.ed-resumen.ed-resumen-activo{border-color:var(--c-ok-border);background:rgba(232,248,241,.96);color:var(--c-ok)}
@media(max-width:520px){.ed-pasos{grid-template-columns:repeat(2,1fr)}.ed-carga{align-items:stretch;flex-direction:column}.ed-cargar-btn{width:100%}.ed-grid,.ed-atenciones,.ed-patologias{grid-template-columns:1fr}.ed-grupo{padding:var(--sp-3)}}
@media(max-width:360px){.ed-hero{padding:var(--sp-3)}.ed-hero-icon{width:36px;height:36px;flex-basis:36px}.ed-pasos li{padding:6px}.ed-resumen{border-radius:var(--r-md)}}
@media(prefers-reduced-motion:reduce){.ed-campo,.ed-cargar-btn{transition:none}}
</style>
<script>
(function(){
  var base=null,secuencia=0,temporizador=null;
  var $=function(id){return document.getElementById(id);};
  var grupos=[
    ['Datos personales',[['RUT','RUT'],['NOMBRE','Nombre completo'],['SEXO','Sexo',['','M','F','OTRO']],['FECHA_NACIMIENTO','Fecha de nacimiento','date']]],
    ['Contacto y situación',[['TELEFONOS','Teléfonos'],['TELEFONO_OBS','Detalle de contacto'],['SECTOR','Sector',['AMARILLO','NARANJO','VERDE']],['ESTADO','Estado',['PENDIENTE','AGENDADO','INGRESADO','NO_CONTESTA','FALLECIDO','NSP']]]],
    ['Ingreso y equipo',[['FECHA_INGRESO','Fecha de ingreso','date'],['PREINGRESO','Preingreso'],['DUPLA_INGRESO','Dupla de ingreso'],['PROFESIONAL_SEGUIMIENTO','Profesional de seguimiento']]],
    ['Agenda manual',[['PROXIMO_CONTROL','Próximo control / seguimiento','date'],['COMPOSICION_CONTROL','Composición del próximo control']]],
    ['Información clínica',[['CONDICIONES','Patologías ECICEP','condiciones'],['OTRAS_PATOLOGIAS','Otras patologías','textarea'],['SALUD_MENTAL','Salud mental',['','SI','NO']],['OBSERVACIONES','Observaciones del paciente','textarea']]]
  ];
  function accionActual_(){var el=document.getElementById('accion');return el?String(el.value||''):'';}
  function activo(){return accionActual_()==='ACTUALIZAR_DATOS';}
  function estado(t,tipo){var el=$('edEstado');el.textContent=t;el.className='ed-status ed-status-'+(tipo||'idle');}
  function reset(){base=null;secuencia++;clearTimeout(temporizador);$('edCargar').disabled=false;$('edCargar').removeAttribute('aria-busy');$('edCampos').replaceChildren();$('edCampos').hidden=true;$('edResumen').textContent='';$('edResumen').className='ed-resumen';estado('Carga la ficha para editarla.','idle');}
  function ajustar(){var on=activo();$('editorPaciente').hidden=!on;['secIdent','secTel','secAgenda','secObs'].forEach(function(id){var el=$(id);if(el)el.style.display=on?'none':'';});}
  function nodo(tag,text,cls){var e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e;}
  function valor(k){var el=$('ed_'+k);if(k==='CONDICIONES')return Array.from(el.querySelectorAll('input:checked')).map(function(x){return x.value;}).sort().join(';');return el.value;}
  function original(k){var s=base.campos[k]||'';return k==='CONDICIONES'?s.split(';').filter(Boolean).sort().join(';'):s;}
  function payload(){
    if(!base||!activo())return null;
    var campos={};grupos.forEach(function(g){g[1].forEach(function(f){var k=f[0],v=valor(k);if(v!==original(k))campos[k]={anterior:base.campos[k]||'',valor:v};});});
    var atenciones=[];['CONTROL','SEGUIMIENTO'].forEach(function(tipo){var modo=$('ed_modo_'+tipo).value;if(!modo)return;var ant=base.ultimos[tipo]||{};atenciones.push({tipo:tipo,modo:modo,fecha:$('ed_fecha_'+tipo).value,idEvento:modo==='CORREGIR'?ant.idEvento||'':'',anterior:modo==='CORREGIR'?ant.fecha||'':''});});
    return {id:base.id,rutOriginal:base.rutOriginal,campos:campos,atenciones:atenciones};
  }
  function resumen(){var a=payload();if(!a)return;var n=Object.keys(a.campos).length,m=a.atenciones.length,total=n+m,el=$('edResumen');el.textContent=total?(n+' campo(s) modificado(s) · '+m+' cambio(s) de atención'):'Sin cambios pendientes · la ficha permanece intacta';el.className='ed-resumen ed-resumen-visible'+(total?' ed-resumen-activo':'');Object.keys(base.campos).forEach(function(k){var campo=$('ed_'+k);if(campo)campo.classList.toggle('ed-cambio',Object.prototype.hasOwnProperty.call(a.campos,k));});}
  function render(r){
    base=r;var root=$('edCampos');root.replaceChildren();root.hidden=false;
    grupos.forEach(function(g){var fs=nodo('fieldset',null,'ed-grupo');fs.appendChild(nodo('legend',g[0]));var grid=nodo('div',null,'ed-grid');
      g[1].forEach(function(f){var k=f[0],tipo=f[2],wrap=nodo('div',null,'ed-campo '+(tipo==='textarea'||tipo==='condiciones'?'ed-ancho':''));var label=nodo('label',f[1],'f-label');label.htmlFor='ed_'+k;wrap.appendChild(label);var el;
        if(Array.isArray(tipo)){el=nodo('select',null,'f-select');tipo.forEach(function(v){var o=nodo('option',v||'Sin especificar');o.value=v;el.appendChild(o);});if(r.campos[k]&&tipo.indexOf(r.campos[k])<0){var old=nodo('option',r.campos[k]);old.value=r.campos[k];el.appendChild(old);}}
        else if(tipo==='condiciones'){el=nodo('div',null,'ed-patologias');(r.condiciones||[]).forEach(function(c){var l=nodo('label'),ch=nodo('input');ch.type='checkbox';ch.value=c.codigo;ch.checked=(r.campos[k]||'').split(';').indexOf(c.codigo)>=0;l.appendChild(ch);l.appendChild(nodo('span',c.nombre));el.appendChild(l);});var hint=nodo('p','La estratificación se actualiza desde las patologías. Actual: '+(r.estratificacion||'Sin confirmar'),'f-hint');wrap.appendChild(hint);(r.campos[k]||'').split(';').filter(Boolean).forEach(function(code){if(!(r.condiciones||[]).some(function(c){return c.codigo===code;})){var l=nodo('label'),ch=nodo('input');ch.type='checkbox';ch.value=code;ch.checked=true;l.appendChild(ch);l.appendChild(nodo('span',code+' (dato existente)'));el.appendChild(l);}});}
        else{el=nodo(tipo==='textarea'?'textarea':'input',null,'f-input');if(tipo!=='textarea'){el.type=tipo==='date'?'date':'text';}if(tipo==='date'&&r.campos[k]&&!/^\d{4}-\d{2}-\d{2}$/.test(r.campos[k]))el.type='text';if(tipo==='date'){el.min=k==='FECHA_NACIMIENTO'?'1900-01-01':'2015-01-01';el.max='2040-12-31';}if(tipo==='textarea')el.rows=3;el.maxLength=5000;}
        el.id='ed_'+k;if(tipo!=='condiciones')el.value=r.campos[k]||'';wrap.appendChild(el);
        if(k==='PREINGRESO')wrap.appendChild(nodo('p','Fecha AAAA-MM-DD, NO_APLICA o PENDIENTE.','f-hint'));
        if(k==='PROXIMO_CONTROL')wrap.appendChild(nodo('p','Vaciar este campo elimina la fecha agendada. No se calcula automáticamente.','f-hint'));
        grid.appendChild(wrap);
      });fs.appendChild(grid);root.appendChild(fs);
    });
    var fs=nodo('fieldset',null,'ed-grupo');fs.appendChild(nodo('legend','Controles y seguimientos'));var atenciones=nodo('div',null,'ed-atenciones');
    ['CONTROL','SEGUIMIENTO'].forEach(function(tipo){var actual=r.ultimos[tipo],titulo=tipo==='CONTROL'?'Control':'Seguimiento',g=nodo('div',null,'ed-atencion');g.appendChild(nodo('p',titulo+' registrado: '+(actual?actual.fecha:(tipo==='CONTROL'?r.ultimoControl:r.ultimoSeguimiento)||'Sin fecha'),'ed-atencion-titulo'));var l=nodo('label','Acción de '+titulo.toLowerCase(),'f-label');l.htmlFor='ed_modo_'+tipo;g.appendChild(l);var select=nodo('select',null,'f-select');select.id=l.htmlFor;[['','Conservar'],['REGISTRAR','Registrar nueva atención'],['CORREGIR','Corregir fecha de la última atención']].forEach(function(o){var opt=nodo('option',o[1]);opt.value=o[0];if(o[0]==='CORREGIR'&&!actual)opt.disabled=true;select.appendChild(opt);});g.appendChild(select);var fl=nodo('label','Fecha de '+titulo.toLowerCase(),'f-label');fl.htmlFor='ed_fecha_'+tipo;g.appendChild(fl);var fecha=nodo('input',null,'f-input');fecha.id=fl.htmlFor;fecha.type='date';fecha.min='2015-01-01';fecha.max='2040-12-31';fecha.disabled=true;g.appendChild(fecha);select.addEventListener('change',function(){fecha.disabled=!select.value;fecha.value=select.value==='CORREGIR'&&actual?actual.fecha:'';resumen();});atenciones.appendChild(g);});fs.appendChild(atenciones);
    fs.appendChild(nodo('p','Una nueva atención se agrega al historial. Corregir mantiene la trazabilidad del registro original. Para una cita futura usa Agenda manual.','f-hint'));root.appendChild(fs);
    estado('Ficha cargada: '+r.campos.NOMBRE+'. Revisa los datos y modifica solo lo necesario.','ok');resumen();
  }
  function cargar(){var rut=$('rut').value,turno=++secuencia;base=null;$('edCampos').hidden=true;$('edResumen').textContent='';$('edResumen').className='ed-resumen';$('edCargar').disabled=true;$('edCargar').setAttribute('aria-busy','true');estado('Buscando la ficha del paciente…','loading');clearTimeout(temporizador);temporizador=setTimeout(function(){if(turno!==secuencia)return;secuencia++;$('edCargar').disabled=false;$('edCargar').removeAttribute('aria-busy');estado('La consulta tardó demasiado. Intenta cargar nuevamente.','error');},30000);
    google.script.run.withSuccessHandler(function(r){if(turno!==secuencia)return;clearTimeout(temporizador);$('edCargar').disabled=false;
      $('edCargar').removeAttribute('aria-busy');if(window.ECICEP_requiereRecarga&&window.ECICEP_requiereRecarga(r)){if(window.ECICEP_reloadUnaVez)window.ECICEP_reloadUnaVez();else estado((r&&r.motivo)||'Acceso vencido. Cierra y reabre el enlace.','error');return;}
      if(window.ECICEP_esServicioOcupado&&window.ECICEP_esServicioOcupado(r)){estado(window.ECICEP_textoServicioOcupado(),'error');return;}
      if(r&&r.ok&&r.id&&r.rutOriginal&&r.campos&&typeof r.campos==='object')render(r);else estado(r&&(r.motivo||r.message)||'No se pudo cargar la ficha.','error');})
      .withFailureHandler(function(e){if(turno!==secuencia)return;clearTimeout(temporizador);$('edCargar').disabled=false;$('edCargar').removeAttribute('aria-busy');var txt=window.ECICEP_errorTexto?window.ECICEP_errorTexto(e):((e&&e.message)||'Error al cargar la ficha');estado(txt+' — Verifica tu conexión e intenta nuevamente.','error');}).WebApp_cargarPacienteEdicionCaptura(rut);
  }
  function validar(){if(!activo())return true;if(!base){estado('Carga primero el paciente que deseas actualizar.','error');$('edCargar').focus();return false;}var a=payload();if(!Object.keys(a.campos).length&&!a.atenciones.length){estado('No has realizado cambios. La ficha permanece intacta.','error');return false;}var invalid=Array.from($('edCampos').querySelectorAll('input,select,textarea')).find(function(el){return !el.disabled&&!el.checkValidity();});if(invalid){invalid.reportValidity();return false;}if(a.atenciones.some(function(e){return !e.fecha;})){estado('Indica la fecha de la atención.','error');return false;}return true;}
  window.ECICEP_EDITOR={payload:payload,validar:validar,reset:reset,ajustar:ajustar,hayCambios:function(){var a=payload();return !!(a&&(Object.keys(a.campos).length||a.atenciones.length));}};
  document.addEventListener('DOMContentLoaded',function(){$('edCargar').addEventListener('click',cargar);$('edCampos').addEventListener('input',resumen);$('edCampos').addEventListener('change',resumen);$('rut').addEventListener('input',reset);var accion=document.getElementById('accion');if(accion)accion.addEventListener('change',function(){setTimeout(ajustar,0);});ajustar();});
})();
</script>
