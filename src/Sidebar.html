<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
body{font-family:Arial,sans-serif;font-size:13px;margin:8px;color:#222}
input,select{width:100%;padding:5px;margin:2px 0 8px;box-sizing:border-box}
button{padding:5px 8px;border:0;border-radius:4px;cursor:pointer;font-size:12px}
.b-azul{background:#0b5394;color:#fff}.b-verde{background:#38761d;color:#fff}
.b-rojo{background:#a61c00;color:#fff}.b-gris{background:#666;color:#fff}
.res{border-bottom:1px solid #ddd;padding:6px 0;cursor:pointer}.res:hover{background:#eef3fa}
.etq{font-size:11px;color:#777;text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0}
td,th{border:1px solid #ddd;padding:3px 4px;text-align:left}
th{background:#f0f4f8;font-size:11px}
.msg{margin-top:6px;padding:5px;display:none;border-radius:3px;font-size:12px}
.ok{display:block;background:#d9ead3}.err{display:block;background:#f4cccc}
#vista,#panelRev,#panelPat{display:none}
h3{margin:8px 0 4px;font-size:14px}
.comp{border:1px solid #ccc;border-radius:4px;padding:6px;margin:4px 0;font-size:12px}
.comp b{color:#0b5394}
.cand{background:#f9f9ff}
.pat-item{display:flex;align-items:center;padding:3px 0;border-bottom:1px solid #eee;cursor:pointer}
.pat-item:hover{background:#f5f7fa}
.peso{font-size:10px;background:#e0e0e0;border-radius:3px;padding:1px 4px;margin-left:auto;color:#555}
.peso2{background:#fce4ec;color:#a61c00;font-weight:bold}
.contador{font-size:12px;color:#0b5394;font-weight:bold;margin:6px 0}
.otras-sep{border-top:2px solid #ccc;margin-top:10px;padding-top:8px;font-size:11px;color:#888}
textarea{width:100%;height:50px;box-sizing:border-box;margin:2px 0}
</style>
</head>
<body>

<div id="panelBuscar">
  <div class="etq">Buscar paciente (RUT o nombre)</div>
  <input id="termino" placeholder="RUT o nombre…">
  <button class="b-azul" onclick="buscar()">🔍 Buscar</button>
  <button class="b-gris" onclick="verRevision()">🧾 Revisión (<span id="cntRev">…</span>)</button>
  <div id="resultados"></div>
</div>

<div id="vista" style="display:none">
  <button class="b-gris" onclick="volver()">← Volver</button>
  <h3 id="fNombre"></h3>
  <table id="fDatos"></table>
  <h3>Historial</h3>
  <table id="fEventos"></table>
  <h3>Registrar gestión</h3>
  <select id="evTipo"></select>
  <input id="evFecha" type="date">
  <input id="evProf" placeholder="Profesional (opcional)">
  <input id="evDesc" placeholder="Descripción (opcional)">
  <button class="b-verde" onclick="registrarEvento()">✔ Registrar</button>
  <div id="msgEv" class="msg"></div>
  <h3>🩺 Patologías</h3>
  <div id="fichaPats"></div>
  <button class="b-gris" onclick="abrirPatologias()">🩺 Editar patologías</button>
</div>

<div id="panelRev" style="display:none">
  <button class="b-gris" onclick="volver()">← Volver</button>
  <h3>Cola de revisión</h3>
  <div id="revMetricas"></div>
  <div id="revLista"></div>
</div>

<script>
var P_ACTUAL=null;
var TIP=['INGRESO','CONTROL','SEGUIMIENTO','PLAN_CUIDADO','GESTION_CASO_INGRESO','GESTION_CASO_EGRESO','EGRESO','OTRO'];
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}

function buscar(){
  var t=document.getElementById('termino').value;if(!t)return;
  document.getElementById('resultados').innerHTML='<i>Buscando…</i>';
  google.script.run.withSuccessHandler(function(l){
    document.getElementById('resultados').innerHTML=l.length?l.map(function(p){
      return '<div class="res" onclick="abrirFicha(\''+esc(p.id)+'\')"><b>'+esc(p.nombre)+'</b><br>'+esc(p.rut)+' · '+esc(p.sector)+' · '+esc(p.estado||'—')+'</div>';
    }).join(''):'<i>Sin resultados</i>';
  }).api_buscar(t);
}

function abrirFicha(id){
  console.log('[ECICEP] abrirFicha → id recibido:', JSON.stringify(id));
  if(!id){alert('ERROR: ID vacío');return;}
  google.script.run
    .withSuccessHandler(function(f){
      if(f && f._diagnostico){
        alert('\ud83d\udd0d DIAGNÓSTICO\n\n'+JSON.stringify(f,null,2));
        return;
      }
      if(!f){alert('PACIENTE_NO_ENCONTRADO');return;}
    document.getElementById('panelBuscar').style.display='none';
    document.getElementById('vista').style.display='block';
    document.getElementById('fNombre').textContent=f.NOMBRE||'';
    var d=[['RUT',f.RUT],['Sexo',f.SEXO],['Edad',f.EDAD],['Teléfono',f.TELEFONOS],['Sector',f.SECTOR],['Estrat.',f.ESTRATIFICACION],['Estado',f.ESTADO],['Próx. control',f.PROXIMO_CONTROL]];
    document.getElementById('fDatos').innerHTML=d.map(function(x){return '<tr><td class="etq">'+x[0]+'</td><td>'+esc(x[1])+'</td></tr>';}).join('');
    var pats=(f.CONDICIONES||'').split(';').filter(Boolean);
    var nombresPats=pats.map(function(cod){
      var match=PAT_CATALOGO.find(function(p){return p.codigo===cod;});
      return match?match.nombre:cod;
    });
    document.getElementById('fichaPats').innerHTML=nombresPats.length?
      '<div style="font-size:12px">'+nombresPats.map(function(n){return '• '+esc(n);}).join('<br>')+'</div>':
      '<i style="color:#888;font-size:11px">Sin patologías registradas</i>';
    // guardar catálogo para uso posterior
    google.script.run.withSuccessHandler(function(cat){PAT_CATALOGO=cat;}).api_patologiasAbrir(f.ID_INTERNO);
    document.getElementById('fEventos').innerHTML='<tr><th>Fecha</th><th>Tipo</th><th>G</th></tr>'+(f.eventos.length?f.eventos.map(function(e){return '<tr><td>'+esc(e.fecha)+'</td><td>'+esc(e.tipo)+'</td><td>'+esc(e.riesgo)+'</td></tr>';}).join(''):'<tr><td colspan=3><i>Sin eventos</i></td></tr>');
    var s=document.getElementById('evTipo');s.innerHTML=TIP.map(function(t){return '<option>'+t+'</option>';}).join('');
    document.getElementById('msgEv').className='msg';
  }).withFailureHandler(function(err){
      alert('ERROR del servidor: ' + (err && err.message ? err.message : err));
      console.error('api_ficha error:', err);
  }).api_ficha(id);
}

function registrarEvento(){
  var m=document.getElementById('msgEv');
  m.textContent='Registrando…';m.className='msg';
  google.script.run.withSuccessHandler(function(r){
    m.textContent=r.ok?'✔ '+r.evento.tipo+' registrado':'✗ '+r.motivo;
    m.className='msg '+(r.ok?'ok':'err');
    if(r.ok)setTimeout(function(){abrirFicha(P_ACTUAL);},500);
  }).api_registrarEvento({idInterno:P_ACTUAL,tipoEvento:document.getElementById('evTipo').value,fecha:document.getElementById('evFecha').value,profesional:document.getElementById('evProf').value,descripcion:document.getElementById('evDesc').value});
}

function verRevision(){
  document.getElementById('panelBuscar').style.display='none';
  document.getElementById('vista').style.display='none';
  document.getElementById('panelRev').style.display='block';
  document.getElementById('revLista').innerHTML='<i>Cargando…</i>';
  google.script.run.withSuccessHandler(function(r){
    var mt=r.metricas||{};
    document.getElementById('revMetricas').innerHTML='<table style="font-size:11px"><tr><th>Abiertos</th><th>Resueltos</th><th>Mismo</th><th>Otro</th></tr><tr><td>'+(mt.abiertos||0)+'</td><td>'+(mt.resueltos||0)+'</td><td>'+(mt.esMismo||0)+'</td><td>'+(mt.esOtro||0)+'</td></tr></table>';
    var cs=r.casos||[];
    document.getElementById('revLista').innerHTML=cs.length?cs.map(function(c){
      var o=c.origen||{},cd=c.candidato;
      return '<div style="border:1px solid #ccc;border-radius:4px;padding:6px;margin:6px 0">'+
        '<div class="etq">'+esc(c.tipo)+' · '+esc(c.criterio)+' · confianza:'+esc(c.confianza)+'</div>'+
        '<div class="comp"><b>📥 Origen:</b><br>Nombre: '+esc(o.nombre)+'<br>RUT: '+esc(o.rut||'sin RUT')+
        '<br>Teléfono: '+esc(o.telefono||'—')+'<br>Sector: '+esc(o.sector)+'<br>Fuente: '+esc(o.fuente)+'</div>'+
        '<div class="comp cand"><b>👤 Candidato:</b>'+
        (cd?'<br>Nombre: '+esc(cd.nombre)+'<br>RUT: '+esc(cd.rut)+'<br>Teléfono: '+esc(cd.telefono||'—')+
         '<br>Sector: '+esc(cd.sector)+'<br>Estrat.: '+esc(cd.estrat||'—')+'<br>Estado: '+esc(cd.estado||'')
         :'<br><i>Sin candidato identificado</i>')+'</div>'+
        '<button class="b-verde" onclick="resolver('+c.indice+',\'CONFIRMAR_MATCH\')">Es el mismo</button> '+
        '<button class="b-rojo" onclick="resolver('+c.indice+',\'RECHAZAR_MATCH\')">Es otro</button>'+
        '</div>';
    }).join(''):'<i>No hay casos pendientes 🎉</i>';
  }).api_revisionListar();
}

function resolver(idx,dec){
  google.script.run.withSuccessHandler(function(r){
    if(!r.ok&&r.motivo==='CONFLICTO_YA_RESUELTO'){alert('CONFLICTO YA RESUELTO');return;}
    alert(r.ok?('Resuelto: '+(r.accion==='CREAR'?'Paciente nuevo creado':'Enlazado a existente')):('✗ '+r.motivo));
    verRevision();
  }).api_revisionResolver(idx,dec);
}

function volver(){
  document.getElementById('vista').style.display='none';
  document.getElementById('panelRev').style.display='none';
  document.getElementById('panelBuscar').style.display='block';
}
document.getElementById('termino').addEventListener('keyup',function(e){if(e.key==='Enter')buscar();});
verRevision();
</script>

<div id="panelPat">
  <button class="b-gris" onclick="volverDePatologias()">← Volver a ficha</button>
  <h3>🩺 Patologías ECICEP</h3>
  <input id="patBuscar" placeholder="Buscar condición…" onkeyup="filtrarPatologias()">
  <div class="contador">Seleccionadas: <span id="patContador">0</span></div>
  <div id="patLista" style="max-height:250px;overflow-y:auto"></div>
  <div class="otras-sep">OTRAS PATOLOGÍAS / CONDICIONES<br><span style="font-size:10px">No reciben ponderación ECICEP automáticamente</span></div>
  <textarea id="otrasPatologias" placeholder="Escriba aquí…"></textarea>
  <button class="b-verde" onclick="guardarPatologias()">💾 Guardar patologías</button>
  <div id="msgPat" class="msg"></div>
</div>

<script>
var PAT_CATALOGO=[], PAT_SELECCIONADAS=[], PAT_ID='';

function abrirPatologias(){
  document.getElementById('vista').style.display='none';
  document.getElementById('panelPat').style.display='block';
  google.script.run.withSuccessHandler(function(r){
    PAT_CATALOGO=r.catalogo||[];PAT_SELECCIONADAS=r.seleccionadas||[];
    document.getElementById('otrasPatologias').value=r.otrasPatologias||'';
    renderizarPatologias('');
    actualizarContador();
  }).api_patologiasAbrir(P_ACTUAL);
}

function renderizarPatologias(filtro){
  var f=(filtro||'').toLowerCase();
  var html=PAT_CATALOGO.filter(function(p){
    if(!f)return true;
    var nombre=p.nombre.toLowerCase(),cod=p.codigo.toLowerCase();
    // búsqueda tolerante sin tildes
    var nf=nombre.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    var ff=f.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    return nf.indexOf(ff)!==-1||cod.indexOf(f)!==-1;
  }).map(function(p){
    var sel=PAT_SELECCIONADAS.indexOf(p.codigo)!==-1;
    var pesoCls=p.peso>=2?'peso peso2':'peso';
    return '<div class="pat-item" onclick="togglePat(\''+p.codigo+'\')">'+
      '<input type="checkbox" '+(sel?'checked':'')+' onclick="event.stopPropagation();togglePat(\''+p.codigo+'\')"> '+
      esc(p.nombre)+'<span class="'+pesoCls+'">'+p.peso+'</span></div>';
  }).join('');
  document.getElementById('patLista').innerHTML=html||'<i>Sin resultados</i>';
}

function togglePat(cod){
  var idx=PAT_SELECCIONADAS.indexOf(cod);
  if(idx!==-1)PAT_SELECCIONADAS.splice(idx,1);
  else PAT_SELECCIONADAS.push(cod);
  renderizarPatologias(document.getElementById('patBuscar').value);
  actualizarContador();
}

function filtrarPatologias(){renderizarPatologias(this.value||document.getElementById('patBuscar').value);}

function actualizarContador(){
  document.getElementById('patContador').textContent=PAT_SELECCIONADAS.length;
}

function guardarPatologias(){
  var m=document.getElementById('msgPat');
  m.textContent='Guardando…';m.className='msg';
  var otras=document.getElementById('otrasPatologias').value;
  google.script.run.withSuccessHandler(function(r){
    m.textContent=r.ok?('✔ '+r.cantidad+' patologías guardadas · Ponderación: '+r.puntaje+' · Estratificación: '+r.estratificacion):('✗ '+r.motivo);
    m.className='msg '+(r.ok?'ok':'err');
  }).api_patologiasGuardar(P_ACTUAL,PAT_SELECCIONADAS.slice(),otras);
}

function volverDePatologias(){
  document.getElementById('panelPat').style.display='none';
  document.getElementById('vista').style.display='block';
  abrirFicha(P_ACTUAL); // refrescar ficha con patologías actualizadas
}

// mostrar patologías en la ficha
var _oldAbrirFicha=abrirFicha;
</script>

</body>
</html>
