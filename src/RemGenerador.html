<!DOCTYPE html>
<html>
<head>
<base target="_top">
<?!= include('00_Tokens') ?>
<style>
/* Vista dialog ancho: 16px — mismo lenguaje que el Panel */
body{font-size:16px;padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-4);min-height:100vh;box-sizing:border-box}
header h1{font-size:22px;margin:0}
header .sub{color:var(--text-muted);font-size:13px;margin-top:2px}
.card{padding:var(--space-5)}
.fila{display:flex;gap:var(--space-4);flex-wrap:wrap}
.campo{flex:1;min-width:180px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip-sel{cursor:pointer;border:1px solid var(--border-strong);background:var(--surface);padding:8px 16px;font:600 13px 'Inter';min-height:38px}
.chip-sel.on{background:var(--primary);border-color:var(--primary);color:#fff}
#btnGen{width:100%;justify-content:center;padding:14px;font-size:15px;margin-top:var(--space-2)}
#resultado{display:none}
.res-cab{font:700 17px 'Sora';color:var(--text-primary)}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3);margin-top:var(--space-3)}
.acciones{display:flex;gap:10px;margin-top:var(--space-4)}
@media(max-width:700px){.res-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Generar REM</h1>
  <div class="sub">Reporte mensual derivado de EVENTOS · Bloque A · solo lectura de datos</div>
</header>

<div class="card">
  <label class="etq">Período</label>
  <div class="fila">
    <div class="campo">
      <select id="selMes" class="inp"></select>
    </div>
    <div class="campo">
      <select id="selAnio" class="inp"></select>
    </div>
    <div class="campo" style="flex:2">
      <label class="etq" style="margin-top:0">Sector</label>
      <select id="selSector" class="inp">
        <option value="TODOS">Todos</option>
        <option value="NARANJO">Naranjo</option>
        <option value="AMARILLO">Amarillo</option>
        <option value="VERDE">Verde</option>
      </select>
    </div>
  </div>
  <button id="btnGen" class="btn btn-pri" onclick="generar(this)">
    <i data-lucide="file-bar-chart"></i> Generar REM
  </button>
</div>

<div class="card" id="resultado">
  <div class="res-cab" id="rCab"></div>
  <div class="res-grid">
    <div class="kpi-mini"><span class="num" id="rEv">—</span><small>Eventos del período</small></div>
    <div class="kpi-mini"><span class="num" id="rPac">—</span><small>Pacientes con actividad</small></div>
    <div class="kpi-mini"><span class="num" id="rInv">—</span><small>Fechas no interpretables</small></div>
  </div>
  <div class="acciones">
    <button class="btn btn-pri" onclick="consultar()"><i data-lucide="eye"></i> Consultar REM</button>
    <button class="btn btn-ghost" onclick="google.script.host.close()">Cerrar</button>
  </div>
  <small style="color:var(--text-muted);margin-top:8px;display:block">
    Bloques B y C: NO DISPONIBLE (#14 / #17). La hoja REM_SALIDA queda actualizada y reproducible.</small>
</div>

<script src="https://unpkg.com/lucide@0.294.0/dist/umd/lucide.min.js"></script>
<script>
var MESES=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
var hoy=new Date();
document.getElementById('selMes').innerHTML=MESES.map(function(m,i){
  return '<option value="'+(i+1)+'"'+(i===hoy.getMonth()?' selected':'')+'>'+m+'</option>';}).join('');
var anios='';
for(var a=hoy.getFullYear();a>=hoy.getFullYear()-4;a--){anios+='<option>'+a+'</option>';}
document.getElementById('selAnio').innerHTML=anios;

function periodoActual(){
  return {anio:+document.getElementById('selAnio').value,
          mes:+document.getElementById('selMes').value};
}

function generar(btn){
  var p=periodoActual();
  var sector=document.getElementById('selSector').value;
  if(!p.anio||!p.mes){toast('Selecciona año y mes del período','err');return;} /* validación #19 */
  var fin=_btnCargando(btn,'Generando REM…'); /* anti doble clic #18 */
  google.script.run.withSuccessHandler(function(r){
    fin();_refrescarIconos();
    if(!r||!r.ok){toast('No fue posible generar el REM. Revisa los datos e inténtalo nuevamente.','err');return;}
    document.getElementById('rCab').textContent=r.cabecera;
    document.getElementById('rEv').textContent=r.eventosPeriodo;
    document.getElementById('rPac').textContent=r.pacientesConActividad;
    var inv=document.getElementById('rInv');
    inv.textContent=r.fechasInvalidas;
    inv.style.color=r.fechasInvalidas?'var(--warning)':'var(--success)';
    document.getElementById('resultado').style.display='block';
    _refrescarIconos();
    if(r.eventosPeriodo===0){toast('REM generado, sin eventos en el período seleccionado','info');}
    else{toast('REM generado correctamente ✓','ok');}
    setTimeout(consultar,700); /* flujo #11: terminar en Consultar REM */
  }).withFailureHandler(function(e){fin();toast('Error: '+(e&&e.message||e),'err');})
  .Rem_generar(p.anio,p.mes,sector);
}
function consultar(){google.script.run.UI_verRem();}
_refrescarIconos();
</script>
</body>
</html>
